groups:
  - name: minecraft-monitoring
    rules:
      - alert: MinecraftDown
        expr: probe_success{job="blackbox-minecraft",instance="mc:25565"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Minecraft Java port is down"
          description: "TCP probe to mc:25565 has failed for more than 2 minutes."

      - alert: RconDown
        expr: probe_success{job="blackbox-minecraft",instance="mc:25575"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Minecraft RCON port is down"
          description: "TCP probe to mc:25575 has failed for more than 5 minutes."

      - alert: BackupStale
        expr: (time() - minecraft_backup_last_success_timestamp_seconds) > 108000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Minecraft backups are stale"
          description: "Newest backup is older than 30 hours."

      - alert: DynDnsStale
        expr: (time() - minecraft_dyndns_last_ip_mtime_seconds) > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "DynDNS updates look stale"
          description: "dyndns last_ip file has not been updated for over 24 hours."

      - alert: ContainerRestartSpike
        expr: |
          sum by (name) (
            increase(container_start_time_seconds{name=~"minecraft|minecraft-backup|minecraft-dyndns"}[15m])
          ) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Container restarted recently"
          description: "Container {{ $labels.name }} restarted in the last 15 minutes."
