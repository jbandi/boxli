services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    user: "1001:1001"
    ports:
      - "25565:25565"          # Java Edition
      - "19132:19132/udp"      # Bedrock via Geyser
    environment:
      # Required
      EULA: "TRUE"
      TYPE: "PAPER"
      TZ: "Europe/Zurich"

      # Server identity & gameplay
      SERVER_NAME: "Böxli"
      MODE: "survival"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "12"
      MOTD: "Willkommen im Böxli!"

      # Performance / view settings (Pi-friendly, Bedrock-safe)
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"

      # Memory & JVM
      MEMORY: "8G"
      USE_AIKAR_FLAGS: "true"

      # Security
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "true"
      #ENFORCE_WHITELIST: "true"
      OPS: "Black_Claw_"
      # Seed initial Java whitelist
      WHITELIST: "Black_Claw_, 123rerererere"

      # RCON (internal only; needed later for backups/exporter)
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"

      # Plugins: Geyser + Floodgate
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot

      SEED: "1560698989"

    volumes:
      - /home/mc/minecraft/data:/data
    restart: unless-stopped

  backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    user: "1001:1001"
    depends_on:
      - mc
    environment:
      TZ: "Europe/Zurich"
      BACKUP_METHOD: "tar"
      BACKUP_INTERVAL: "24h"
      PRUNE_BACKUPS_DAYS: "30"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"
      PAUSE_IF_NO_PLAYERS: "true"
      ANNOUNCE_BACKUP: "true"
    volumes:
      - /home/mc/minecraft/data:/data:ro
      - /home/mc/minecraft/backups:/backups
    restart: unless-stopped

  dyndns:
    image: curlimages/curl:8.12.1
    container_name: minecraft-dyndns
    user: "1001:1001"
    environment:
      TZ: "Europe/Zurich"
      DYNDNS_HOST: "${DYNDNS_HOST}"
      DYNDNS_USER: "${DYNDNS_USER}"
      DYNDNS_PASS: "${DYNDNS_PASS}"
      CHECK_INTERVAL: "300"
    volumes:
      - /home/mc/minecraft/dyndns:/state
    command: >
      sh -ec '
        log() { echo "[`date +"%Y-%m-%d %H:%M:%S %Z"`] $$*"; }
        update_infomaniak() {
          IP="$$(curl -4 -fsS --max-time 10 https://api.ipify.org 2>&1)" || { log "ERROR  ip-check failed: $$IP"; return 1; }
          if [ -z "$$IP" ]; then log "WARN   ip-check returned empty response"; return 1; fi
          log "UPDATE ip=$$IP, sending to Infomaniak..."
          HTTP_CODE="$$(curl -4 -sS --max-time 10 -o /tmp/dyndns_resp -w "%%{http_code}" -u "$$DYNDNS_USER:$$DYNDNS_PASS" "https://infomaniak.com/nic/update?hostname=$$DYNDNS_HOST" 2>&1)" || { log "ERROR  update request failed: $$HTTP_CODE"; return 1; }
          RESP="$$(cat /tmp/dyndns_resp)"
          echo "$$RESP" > /state/last_infomaniak_resp || log "WARN   could not persist response"
          if echo "$$RESP" | grep -Eq "good|nochg"; then
            echo "$$IP" > /state/last_ip || log "WARN   could not persist ip to /state/last_ip"
            touch /state/last_infomaniak_ok || log "WARN   could not persist update timestamp"
            log "OK     update success – response=\"$$RESP\" http=$$HTTP_CODE"
          else
            log "ERROR  update failed – response=\"$$RESP\" http=$$HTTP_CODE"
            return 1
          fi
        }
        log "dyndns started – host=$$DYNDNS_HOST interval=$${CHECK_INTERVAL}s"
        touch /state/.writetest 2>/dev/null && rm -f /state/.writetest || { log "FATAL  /state is not writable – fix with: sudo chown 1001:1001 /home/mc/minecraft/dyndns"; exit 1; }
        log "INIT   performing initial Infomaniak update..."
        update_infomaniak || log "WARN   initial update failed, will retry in loop"
        while true; do
          IP="$$(curl -4 -fsS --max-time 10 https://api.ipify.org 2>&1)" || { log "ERROR  ip-check failed: $$IP"; sleep "$$CHECK_INTERVAL"; continue; }
          LAST="$$(cat /state/last_ip 2>/dev/null || true)"
          if [ -z "$$IP" ]; then
            log "WARN   ip-check returned empty response"
          elif [ "$$IP" = "$$LAST" ]; then
            log "OK     ip=$$IP (unchanged)"
          else
            log "CHANGE ip=$$IP (was $${LAST:-<none>}), updating Infomaniak..."
            update_infomaniak || log "WARN   update failed, will retry next cycle"
          fi
          sleep "$$CHECK_INTERVAL"
        done
      '
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: minecraft-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-14d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: minecraft-grafana
    environment:
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://boxli.local:3000}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: minecraft-loki
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: minecraft-alloy
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: minecraft-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: minecraft-cadvisor
    command:
      - --docker=unix:///var/run/docker.sock
      - --store_container_labels=true
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project,com.docker.compose.container-number,com.docker.compose.oneoff
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: minecraft-blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped

  file-metrics:
    image: busybox:1.37.0
    container_name: minecraft-file-metrics
    command: >
      sh -ec '
        mkdir -p /www;
        while true; do
          NOW="$$(date +%s)";
          LATEST_BACKUP_FILE="$$(ls -1t /backups 2>/dev/null | head -n1 || true)";
          if [ -n "$$LATEST_BACKUP_FILE" ] && [ -e "/backups/$$LATEST_BACKUP_FILE" ]; then
            BACKUP_TS="$$(stat -c %Y "/backups/$$LATEST_BACKUP_FILE" 2>/dev/null || echo 0)";
          else
            BACKUP_TS="0";
          fi;
          DYNDNS_TS="$$(stat -c %Y /dyndns/last_ip 2>/dev/null || echo 0)";
          DYNDNS_IP="$$(cat /dyndns/last_ip 2>/dev/null || echo '')";
          DYNDNS_UPDATE_TS="$$(stat -c %Y /dyndns/last_infomaniak_ok 2>/dev/null || echo 0)";
          DYNDNS_RESP="$$(cat /dyndns/last_infomaniak_resp 2>/dev/null)";
          [ -z "$$DYNDNS_RESP" ] && DYNDNS_RESP="no update yet";
          printf "%s\n" \
            "# HELP minecraft_backup_last_success_timestamp_seconds Unix timestamp of newest backup file." \
            "# TYPE minecraft_backup_last_success_timestamp_seconds gauge" \
            "minecraft_backup_last_success_timestamp_seconds $$BACKUP_TS" \
            "# HELP minecraft_dyndns_last_ip_mtime_seconds Unix timestamp of the dyndns last_ip state file." \
            "# TYPE minecraft_dyndns_last_ip_mtime_seconds gauge" \
            "minecraft_dyndns_last_ip_mtime_seconds $$DYNDNS_TS" \
            "# HELP minecraft_dyndns_ip_info Current public IP address." \
            "# TYPE minecraft_dyndns_ip_info gauge" \
            "minecraft_dyndns_ip_info{ip=\"$$DYNDNS_IP\"} 1" \
            "# HELP minecraft_dyndns_last_infomaniak_update_seconds Unix timestamp of last successful Infomaniak DynDNS update." \
            "# TYPE minecraft_dyndns_last_infomaniak_update_seconds gauge" \
            "minecraft_dyndns_last_infomaniak_update_seconds $$DYNDNS_UPDATE_TS" \
            "# HELP minecraft_dyndns_infomaniak_response_info Last response from Infomaniak DynDNS API." \
            "# TYPE minecraft_dyndns_infomaniak_response_info gauge" \
            "minecraft_dyndns_infomaniak_response_info{response=\"$$DYNDNS_RESP\"} 1" \
            "# HELP minecraft_file_metrics_scrape_generated_timestamp_seconds Unix timestamp when this metrics file was generated." \
            "# TYPE minecraft_file_metrics_scrape_generated_timestamp_seconds gauge" \
            "minecraft_file_metrics_scrape_generated_timestamp_seconds $$NOW" \
            > /www/metrics;
          sleep 30;
        done &
        exec httpd -f -p 9105 -h /www
      '
    volumes:
      - /home/mc/minecraft/backups:/backups:ro
      - /home/mc/minecraft/dyndns:/dyndns:ro
    restart: unless-stopped

  lametric-writer:
    image: itzg/mc-backup:latest
    container_name: minecraft-lametric-writer
    user: "1001:1001"
    depends_on:
      - mc
    entrypoint:
      - /bin/sh
      - -ec
    environment:
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"
      LAMETRIC_REFRESH_SECONDS: "20"
    command:
      - |
        mkdir -p /www
        write_lametric() {
          TEXT="$$1"
          printf '{\n    "frames": [\n        {\n            "text": "%s",\n            "icon": 311\n        }\n    ]\n}\n' "$$TEXT" > /www/lametric
        }
        write_lametric "-- 0 --"
        while true; do
          RESP="$$(rcon-cli list 2>/dev/null || true)"
          COUNT="$$(printf "%s\n" "$$RESP" | sed -n "s/.*There are \\([0-9][0-9]*\\) of a max.*/\\1/p" | head -n1)"
          NAMES_RAW="$$(printf "%s\n" "$$RESP" | sed -n "s/.*players online:[[:space:]]*//p" | head -n1)"
          case "$$COUNT" in
            ""|*[!0-9]*) COUNT="0" ;;
          esac
          TEXT="-- $$COUNT --"
          if [ "$$COUNT" -gt 0 ] && [ -n "$$NAMES_RAW" ]; then
            OLD_IFS="$$IFS"
            IFS=','
            for NAME in $$NAMES_RAW; do
              NAME_TRIM="$$(printf "%s" "$$NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$$//')"
              NAME_SHORT="$$(printf "%s" "$$NAME_TRIM" | cut -c1-6)"
              TEXT="$${TEXT} $${NAME_SHORT} "
            done
            IFS="$$OLD_IFS"
          fi
          write_lametric "$$TEXT"
          sleep "$${LAMETRIC_REFRESH_SECONDS}"
        done
    volumes:
      - /home/mc/minecraft/boxli-www:/www
    restart: unless-stopped

  boxli-http:
    image: nginx:1.27-alpine
    container_name: minecraft-boxli-http
    depends_on:
      - lametric-writer
    volumes:
      - /home/mc/minecraft/boxli-www:/usr/share/nginx/html:ro
    ports:
      - "18088:80"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
