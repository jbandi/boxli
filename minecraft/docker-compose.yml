services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    user: "1001:1001"
    ports:
      - "25565:25565"          # Java Edition
      - "19132:19132/udp"      # Bedrock via Geyser
    environment:
      # Required
      EULA: "TRUE"
      TYPE: "PAPER"
      TZ: "Europe/Zurich"

      # Server identity & gameplay
      SERVER_NAME: "Böxli"
      MODE: "survival"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "12"
      MOTD: "Willkommen im Böxli!"

      # Performance / view settings (Pi-friendly, Bedrock-safe)
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"

      # Memory & JVM
      MEMORY: "8G"
      USE_AIKAR_FLAGS: "true"

      # Security
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "true"
      #ENFORCE_WHITELIST: "true"
      OPS: "Black_Claw_"
      # Seed initial Java whitelist
      WHITELIST: "Black_Claw_, 123rerererere"

      # RCON (internal only; needed later for backups/exporter)
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"

      # Plugins: Geyser + Floodgate
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot

      SEED: "1560698989"

    volumes:
      - /home/mc/minecraft/data:/data
    restart: unless-stopped

  backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    user: "1001:1001"
    depends_on:
      - mc
    environment:
      TZ: "Europe/Zurich"
      BACKUP_METHOD: "tar"
      BACKUP_INTERVAL: "24h"
      PRUNE_BACKUPS_DAYS: "30"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"
      PAUSE_IF_NO_PLAYERS: "true"
      ANNOUNCE_BACKUP: "true"
    volumes:
      - /home/mc/minecraft/data:/data:ro
      - /home/mc/minecraft/backups:/backups
    restart: unless-stopped

  dyndns:
    image: curlimages/curl:8.12.1
    container_name: minecraft-dyndns
    user: "1001:1001"
    network_mode: "host"
    environment:
      TZ: "Europe/Zurich"
      DYNDNS_HOST: "${DYNDNS_HOST}"
      DYNDNS_USER: "${DYNDNS_USER}"
      DYNDNS_PASS: "${DYNDNS_PASS}"
      CHECK_INTERVAL: "300"
    volumes:
      - /home/mc/minecraft/dyndns:/state
    command: >
      sh -ec '
        log() { echo "[`date +"%Y-%m-%d %H:%M:%S %Z"`] $$*"; }
        get_ipv4() { curl -4 -fsS --max-time 10 https://api.ipify.org; }
        get_ipv6() { curl -6 -fsS --max-time 10 https://api64.ipify.org 2>/dev/null || true; }
        update_infomaniak() {
          IPV4="$$(get_ipv4 2>&1)" || { log "ERROR  ip-check failed: $$IPV4"; return 1; }
          IPV6="$$(get_ipv6)"
          if [ -z "$$IPV4" ]; then log "WARN   ip-check returned empty response"; return 1; fi
          log "UPDATE ip=$$IPV4, sending to Infomaniak..."
          touch /state/last_infomaniak_request || log "WARN   could not persist request timestamp"
          HTTP_CODE="$$(curl -4 -sS --max-time 10 -o /tmp/dyndns_resp -w "%%{http_code}" -u "$$DYNDNS_USER:$$DYNDNS_PASS" "https://infomaniak.com/nic/update?hostname=$$DYNDNS_HOST" 2>&1)" || { log "ERROR  update request failed: $$HTTP_CODE"; return 1; }
          RESP="$$(cat /tmp/dyndns_resp)"
          PREV_RESP="$$(cat /state/last_infomaniak_resp 2>/dev/null || true)"
          [ -n "$$PREV_RESP" ] && echo "$$PREV_RESP" > /state/last_infomaniak_prev_resp || true
          echo "$$RESP" > /state/last_infomaniak_resp || log "WARN   could not persist response"
          if echo "$$RESP" | grep -Eq "good|nochg"; then
            echo "$$IPV4" > /state/last_ip || log "WARN   could not persist ip to /state/last_ip"
            echo "$$IPV4" > /state/last_ipv4 || log "WARN   could not persist IPv4 to /state/last_ipv4"
            if [ -n "$$IPV6" ]; then
              echo "$$IPV6" > /state/last_ipv6 || log "WARN   could not persist IPv6 to /state/last_ipv6"
            else
              : > /state/last_ipv6 || log "WARN   could not clear /state/last_ipv6"
            fi
            touch /state/last_infomaniak_ok || log "WARN   could not persist update timestamp"
            log "OK     update success – response=\"$$RESP\" http=$$HTTP_CODE"
          else
            log "ERROR  update failed – response=\"$$RESP\" http=$$HTTP_CODE"
            return 1
          fi
        }
        log "dyndns started – host=$$DYNDNS_HOST interval=$${CHECK_INTERVAL}s"
        touch /state/.writetest 2>/dev/null && rm -f /state/.writetest || { log "FATAL  /state is not writable – fix with: sudo chown 1001:1001 /home/mc/minecraft/dyndns"; exit 1; }
        log "INIT   performing initial Infomaniak update..."
        update_infomaniak || log "WARN   initial update failed, will retry in loop"
        while true; do
          IPV4="$$(get_ipv4 2>&1)" || { log "ERROR  ip-check failed: $$IPV4"; sleep "$$CHECK_INTERVAL"; continue; }
          IPV6="$$(get_ipv6)"
          echo "$$IPV4" > /state/last_ipv4 || log "WARN   could not persist IPv4 to /state/last_ipv4"
          if [ -n "$$IPV6" ]; then
            echo "$$IPV6" > /state/last_ipv6 || log "WARN   could not persist IPv6 to /state/last_ipv6"
          else
            : > /state/last_ipv6 || log "WARN   could not clear /state/last_ipv6"
          fi
          LAST="$$(cat /state/last_ip 2>/dev/null || true)"
          if [ -z "$$IPV4" ]; then
            log "WARN   ip-check returned empty response"
          elif [ "$$IPV4" = "$$LAST" ]; then
            log "OK     ip=$$IPV4 (unchanged)"
          else
            log "CHANGE ip=$$IPV4 (was $${LAST:-<none>}), updating Infomaniak..."
            update_infomaniak || log "WARN   update failed, will retry next cycle"
          fi
          sleep "$$CHECK_INTERVAL"
        done
      '
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: minecraft-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-14d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: minecraft-grafana
    environment:
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://boxli.local:3000}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: minecraft-loki
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: minecraft-alloy
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./monitoring/alloy/player-activity-filters.json:/etc/alloy/player-activity-filters.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: minecraft-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: minecraft-cadvisor
    command:
      - --docker=unix:///var/run/docker.sock
      - --store_container_labels=true
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project,com.docker.compose.container-number,com.docker.compose.oneoff
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: minecraft-blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped

  file-metrics:
    image: busybox:1.37.0
    container_name: minecraft-file-metrics
    command: >
      sh -ec '
        mkdir -p /www;
        escape_label() {
          printf "%s" "$$1" | tr "\n\r" "  " | sed -e "s/\\\\/\\\\\\\\/g" -e "s/\"/\\\\\"/g";
        }
        while true; do
          NOW="$$(date +%s)";
          LATEST_BACKUP_FILE="$$(ls -1t /backups 2>/dev/null | head -n1 || true)";
          if [ -n "$$LATEST_BACKUP_FILE" ] && [ -e "/backups/$$LATEST_BACKUP_FILE" ]; then
            BACKUP_TS="$$(stat -c %Y "/backups/$$LATEST_BACKUP_FILE" 2>/dev/null || echo 0)";
          else
            BACKUP_TS="0";
          fi;
          DYNDNS_TS="$$(stat -c %Y /dyndns/last_ip 2>/dev/null || echo 0)";
          DYNDNS_IPV4="$$(cat /dyndns/last_ipv4 2>/dev/null || cat /dyndns/last_ip 2>/dev/null || echo '')";
          DYNDNS_IPV6="$$(cat /dyndns/last_ipv6 2>/dev/null || echo '')";
          [ -z "$$DYNDNS_IPV4" ] && DYNDNS_IPV4="n/a";
          [ -z "$$DYNDNS_IPV6" ] && DYNDNS_IPV6="n/a";
          DYNDNS_IP="$$DYNDNS_IPV4";
          DYNDNS_UPDATE_TS="$$(stat -c %Y /dyndns/last_infomaniak_ok 2>/dev/null || echo 0)";
          DYNDNS_REQ_TS="$$(stat -c %Y /dyndns/last_infomaniak_request 2>/dev/null || echo 0)";
          DYNDNS_RESP="$$(cat /dyndns/last_infomaniak_resp 2>/dev/null)";
          DYNDNS_PREV_RESP="$$(cat /dyndns/last_infomaniak_prev_resp 2>/dev/null || echo '')";
          [ -z "$$DYNDNS_RESP" ] && DYNDNS_RESP="no update yet";
          [ -z "$$DYNDNS_PREV_RESP" ] && DYNDNS_PREV_RESP="n/a";
          if [ "$$DYNDNS_REQ_TS" -gt 0 ] 2>/dev/null; then
            DYNDNS_REQ_HUMAN="$$(date -u -d "@$$DYNDNS_REQ_TS" "+%Y-%m-%d %H:%M:%S UTC" 2>/dev/null || echo "$$DYNDNS_REQ_TS")";
          else
            DYNDNS_REQ_HUMAN="n/a";
          fi;
          DYNDNS_IP_ESC="$$(escape_label "$$DYNDNS_IP")";
          DYNDNS_IPV4_ESC="$$(escape_label "$$DYNDNS_IPV4")";
          DYNDNS_IPV6_ESC="$$(escape_label "$$DYNDNS_IPV6")";
          DYNDNS_RESP_ESC="$$(escape_label "$$DYNDNS_RESP")";
          DYNDNS_PREV_RESP_ESC="$$(escape_label "$$DYNDNS_PREV_RESP")";
          DYNDNS_REQ_HUMAN_ESC="$$(escape_label "$$DYNDNS_REQ_HUMAN")";
          METRICS_TMP="/www/metrics.tmp";
          printf "%s\n" \
            "# HELP minecraft_backup_last_success_timestamp_seconds Unix timestamp of newest backup file." \
            "# TYPE minecraft_backup_last_success_timestamp_seconds gauge" \
            "minecraft_backup_last_success_timestamp_seconds $$BACKUP_TS" \
            "# HELP minecraft_backup_file_info Backup files currently present on disk." \
            "# TYPE minecraft_backup_file_info gauge" \
            "# HELP minecraft_backup_file_size_bytes Backup file size in bytes." \
            "# TYPE minecraft_backup_file_size_bytes gauge" \
            "# HELP minecraft_backup_file_mtime_seconds Backup file mtime as unix timestamp in seconds." \
            "# TYPE minecraft_backup_file_mtime_seconds gauge" \
            "# HELP minecraft_dyndns_last_ip_mtime_seconds Unix timestamp of the dyndns last_ip state file." \
            "# TYPE minecraft_dyndns_last_ip_mtime_seconds gauge" \
            "minecraft_dyndns_last_ip_mtime_seconds $$DYNDNS_TS" \
            "# HELP minecraft_dyndns_ip_info Current public IP address." \
            "# TYPE minecraft_dyndns_ip_info gauge" \
            "minecraft_dyndns_ip_info{ip=\"$$DYNDNS_IP_ESC\"} 1" \
            "# HELP minecraft_dyndns_ipv4_info Current public IPv4 address." \
            "# TYPE minecraft_dyndns_ipv4_info gauge" \
            "minecraft_dyndns_ipv4_info{ip=\"$$DYNDNS_IPV4_ESC\"} 1" \
            "# HELP minecraft_dyndns_ipv6_info Current public IPv6 address." \
            "# TYPE minecraft_dyndns_ipv6_info gauge" \
            "minecraft_dyndns_ipv6_info{ip=\"$$DYNDNS_IPV6_ESC\"} 1" \
            "# HELP minecraft_dyndns_last_infomaniak_update_seconds Unix timestamp of last successful Infomaniak DynDNS update." \
            "# TYPE minecraft_dyndns_last_infomaniak_update_seconds gauge" \
            "minecraft_dyndns_last_infomaniak_update_seconds $$DYNDNS_UPDATE_TS" \
            "# HELP minecraft_dyndns_last_infomaniak_request_seconds Unix timestamp of latest Infomaniak DynDNS request attempt." \
            "# TYPE minecraft_dyndns_last_infomaniak_request_seconds gauge" \
            "minecraft_dyndns_last_infomaniak_request_seconds $$DYNDNS_REQ_TS" \
            "# HELP minecraft_dyndns_infomaniak_response_info Last response from Infomaniak DynDNS API." \
            "# TYPE minecraft_dyndns_infomaniak_response_info gauge" \
            "minecraft_dyndns_infomaniak_response_info{response=\"$$DYNDNS_RESP_ESC\"} 1" \
            "# HELP minecraft_dyndns_prev_infomaniak_response_info Second latest response from Infomaniak DynDNS API." \
            "# TYPE minecraft_dyndns_prev_infomaniak_response_info gauge" \
            "minecraft_dyndns_prev_infomaniak_response_info{response=\"$$DYNDNS_PREV_RESP_ESC\"} 1" \
            "# HELP minecraft_dyndns_last_check_info Last DynDNS check status and timestamp." \
            "# TYPE minecraft_dyndns_last_check_info gauge" \
            "minecraft_dyndns_last_check_info{timestamp_seconds=\"$$DYNDNS_UPDATE_TS\",status=\"$$DYNDNS_RESP_ESC\",ipv4=\"$$DYNDNS_IPV4_ESC\",ipv6=\"$$DYNDNS_IPV6_ESC\"} 1" \
            "# HELP minecraft_dyndns_last_request_panel_info Labels for Last DynDNS panel (latest request timestamp and previous status)." \
            "# TYPE minecraft_dyndns_last_request_panel_info gauge" \
            "minecraft_dyndns_last_request_panel_info{timestamp=\"$$DYNDNS_REQ_HUMAN_ESC\",previous_status=\"$$DYNDNS_PREV_RESP_ESC\"} 1" \
            "# HELP minecraft_file_metrics_scrape_generated_timestamp_seconds Unix timestamp when this metrics file was generated." \
            "# TYPE minecraft_file_metrics_scrape_generated_timestamp_seconds gauge" \
            "minecraft_file_metrics_scrape_generated_timestamp_seconds $$NOW" \
            > "$$METRICS_TMP";
          for BACKUP_PATH in /backups/*; do
            [ -f "$$BACKUP_PATH" ] || continue;
            BACKUP_NAME="$${BACKUP_PATH##*/}";
            BACKUP_NAME_ESC="$$(escape_label "$$BACKUP_NAME")";
            BACKUP_SIZE="$$(stat -c %s "$$BACKUP_PATH" 2>/dev/null || echo 0)";
            BACKUP_MTIME="$$(stat -c %Y "$$BACKUP_PATH" 2>/dev/null || echo 0)";
            printf "minecraft_backup_file_info{file=\"%s\",size_bytes=\"%s\",mtime_seconds=\"%s\"} 1\n" \
              "$$BACKUP_NAME_ESC" "$$BACKUP_SIZE" "$$BACKUP_MTIME" >> "$$METRICS_TMP";
            printf "minecraft_backup_file_size_bytes{file=\"%s\"} %s\n" \
              "$$BACKUP_NAME_ESC" "$$BACKUP_SIZE" >> "$$METRICS_TMP";
            printf "minecraft_backup_file_mtime_seconds{file=\"%s\"} %s\n" \
              "$$BACKUP_NAME_ESC" "$$BACKUP_MTIME" >> "$$METRICS_TMP";
          done;
          mv "$$METRICS_TMP" /www/metrics;
          sleep 30;
        done &
        exec httpd -f -p 9105 -h /www
      '
    volumes:
      - /home/mc/minecraft/backups:/backups:ro
      - /home/mc/minecraft/dyndns:/dyndns:ro
    restart: unless-stopped

  lametric-writer:
    image: itzg/mc-backup:latest
    container_name: minecraft-lametric-writer
    user: "1001:1001"
    depends_on:
      - mc
    entrypoint:
      - /bin/sh
      - -ec
    environment:
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"
      LAMETRIC_REFRESH_SECONDS: "20"
    command:
      - |
        mkdir -p /www
        write_lametric() {
          printf '{\n    "frames": [\n%s\n    ]\n}\n' "$$FRAMES" > /www/lametric
        }
        add_frame() {
          FRAME_TEXT="$$1"
          FRAME_ICON="$$2"
          FRAME_JSON="$$(printf '        {\n            "text": "%s",\n            "icon": %s\n        }' "$$FRAME_TEXT" "$$FRAME_ICON")"
          if [ -n "$$FRAMES" ]; then
            FRAMES="$$(printf '%s,\n%s' "$$FRAMES" "$$FRAME_JSON")"
          else
            FRAMES="$$FRAME_JSON"
          fi
        }
        pad_center_7() {
          NAME_SHORT="$$(printf "%s" "$$1" | cut -c1-7)"
          NAME_LEN="$$(printf "%s" "$$NAME_SHORT" | wc -c | tr -d ' ')"
          if [ "$$NAME_LEN" -lt 7 ]; then
            PAD_TOTAL="$$((7 - NAME_LEN))"
            PAD_LEFT="$$(((PAD_TOTAL + 1) / 2))"
            PAD_RIGHT="$$((PAD_TOTAL - PAD_LEFT))"
            NAME_SHORT="$$(printf "%*s%s%*s" "$$PAD_LEFT" "" "$$NAME_SHORT" "$$PAD_RIGHT" "")"
          fi
          printf "%s" "$$NAME_SHORT"
        }
        normalize_name() {
          printf "%s" "$$1" | sed 's/^[[:space:].]*//;s/[[:space:].]*$$//' | tr '[:upper:]' '[:lower:]'
        }
        FRAMES=""
        add_frame "-- 0 --" 311
        write_lametric
        while true; do
          RESP="$$(rcon-cli list 2>/dev/null || true)"
          COUNT="$$(printf "%s\n" "$$RESP" | sed -n "s/.*There are \\([0-9][0-9]*\\) of a max.*/\\1/p" | head -n1)"
          NAMES_RAW="$$(printf "%s\n" "$$RESP" | sed -n "s/.*players online:[[:space:]]*//p" | head -n1)"
          case "$$COUNT" in
            ""|*[!0-9]*) COUNT="0" ;;
          esac
          FRAMES=""
          add_frame "-- $$COUNT --" 311
          if [ "$$COUNT" -gt 0 ] && [ -n "$$NAMES_RAW" ]; then
            OLD_IFS="$$IFS"
            IFS=','
            for NAME in $$NAMES_RAW; do
              NAME_TRIM="$$(printf "%s" "$$NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$$//')"
              NAME_MATCH="$$(normalize_name "$$NAME_TRIM")"
              RESOLVED_NAME=""
              if [ -f /players.csv ]; then
                while IFS=',' read -r PLAYER_NAME REAL_NAME; do
                  [ "$$PLAYER_NAME" = "player_name" ] && continue
                  PLAYER_MATCH="$$(normalize_name "$$PLAYER_NAME")"
                  if [ -n "$$PLAYER_MATCH" ] && printf "%s" "$$NAME_MATCH" | grep -Fq "$$PLAYER_MATCH"; then
                    RESOLVED_NAME="$$(printf "%s" "$$REAL_NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$$//')"
                    break
                  fi
                done < /players.csv
              fi
              if [ -n "$$RESOLVED_NAME" ]; then
                NAME_PRINT="$$RESOLVED_NAME"
              else
                NAME_PRINT="$$NAME_TRIM"
              fi
              NAME_SHORT="$$(pad_center_7 "$$NAME_PRINT")"
              add_frame "$$NAME_SHORT" 2762
            done
            IFS="$$OLD_IFS"
          fi
          write_lametric
          sleep "$${LAMETRIC_REFRESH_SECONDS}"
        done
    volumes:
      - /home/mc/minecraft/boxli-www:/www
      - /home/mc/minecraft/players.csv:/players.csv:ro
    restart: unless-stopped

  boxli-http:
    image: nginx:1.27-alpine
    container_name: minecraft-boxli-http
    depends_on:
      - lametric-writer
    volumes:
      - /home/mc/minecraft/boxli-www:/usr/share/nginx/html:ro
    ports:
      - "18088:80"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
