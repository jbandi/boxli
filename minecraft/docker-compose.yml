services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    user: "1001:1001"
    ports:
      - "25565:25565"          # Java Edition
      - "19132:19132/udp"      # Bedrock via Geyser
    environment:
      # Required
      EULA: "TRUE"
      TYPE: "PAPER"
      TZ: "Europe/Zurich"

      # Server identity & gameplay
      SERVER_NAME: "Böxli"
      MODE: "survival"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      MOTD: "Willkommen im Böxli!"

      # Performance / view settings (Pi-friendly, Bedrock-safe)
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"

      # Memory & JVM
      MEMORY: "8G"
      USE_AIKAR_FLAGS: "true"

      # Security
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "true"
      #ENFORCE_WHITELIST: "true"
      OPS: "Black_Claw_"
      # Seed initial Java whitelist
      WHITELIST: "Black_Claw_, 123rerererere"

      # RCON (internal only; needed later for backups/exporter)
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"

      # Plugins: Geyser + Floodgate
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot

      SEED: "1560698989"

    volumes:
      - /home/mc/minecraft/data:/data
    restart: unless-stopped

  backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    user: "1001:1001"
    depends_on:
      - mc
    environment:
      TZ: "Europe/Zurich"
      BACKUP_METHOD: "tar"
      BACKUP_INTERVAL: "24h"
      PRUNE_BACKUPS_DAYS: "30"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"
      PAUSE_IF_NO_PLAYERS: "true"
      ANNOUNCE_BACKUP: "true"
    volumes:
      - /home/mc/minecraft/data:/data:ro
      - /home/mc/minecraft/backups:/backups
    restart: unless-stopped
